# InsightFlow AI — backend deployment blueprint (Render).
#
# Only the FastAPI service lives here. The Next.js frontend goes to Vercel, and
# the database is created separately (Neon). See docs/DEPLOYMENT.md section 12
# for why the two halves are split and what each one needs.
#
# To use: Render dashboard → New → Blueprint → pick this repository. Render
# reads this file, asks for the values marked `sync: false`, and builds.
#
# ---------------------------------------------------------------------------
# What the free plan actually gives you, stated plainly
# ---------------------------------------------------------------------------
# * 512 MB RAM. Measured: the app occupies ~130 MB with everything imported,
#   and a 200k-row frame adds ~7 MB. Demo-sized files fit comfortably. Files
#   near MAX_ANALYSIS_ROWS (500k) will not — lower that variable, which is why
#   it is set explicitly below rather than left at its default.
# * The service sleeps after 15 minutes without traffic and takes ~50 seconds
#   to wake. The first request after a quiet night is slow; nothing is lost.
# * **No persistent disk.** Render does not offer disks on free instances, at
#   any price, so uploaded files live on a filesystem that is wiped on every
#   restart and redeploy. Analyses, metrics, insights and anomalies are all in
#   PostgreSQL and survive; the uploaded file itself does not, so `Ask` and
#   `Investigate` — which recompute from the file — will say the dataset needs
#   uploading again. That is a real limitation, honestly reported to the user
#   rather than a 500, and it is the price of the free tier.
#
# Attaching a disk requires a paid instance (from $7/month, plus $0.25/GB for
# the disk). The `disk:` block below is what to uncomment when you do.

services:
  - type: web
    name: insightflow-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # `/health` reports liveness and never raises, which is what a platform
    # health check should key on. `/ready` is the stricter probe — it returns
    # 503 when the database or storage is unreachable — and is deliberately
    # not used here: a transient database blip should not kill a process that
    # will recover on its own.
    healthCheckPath: /api/v1/health

    # Uploads survive restarts only with this. Free instances cannot have it.
    # disk:
    #   name: insightflow-storage
    #   mountPath: /app/storage
    #   sizeGB: 1

    envVars:
      - key: ENVIRONMENT
        value: production

      # Generated once by Render and never shown to anyone. With
      # ENVIRONMENT=production the app refuses to boot if this is missing,
      # short, or still the development placeholder.
      - key: SECRET_KEY
        generateValue: true

      # Paste the Neon connection string. Use Neon's **direct** (unpooled)
      # string, not the `-pooler` one: this service is a single long-lived
      # process that keeps its own SQLAlchemy pool, and Neon's own guidance is
      # to use a direct connection for schema migrations, which run at
      # start-up. See docs/DEPLOYMENT.md section 3.
      - key: DATABASE_URL
        sync: false

      # The Vercel origin, e.g. https://insightflow-ai.vercel.app
      #
      # Belt and braces: the browser never calls this API directly, so CORS is
      # not on the request path at all. It is set correctly anyway so that the
      # day someone does point a browser here, the answer is the right one
      # rather than an accidental wildcard.
      - key: CORS_ORIGINS
        sync: false

      # Must be byte-identical to PROXY_SHARED_SECRET in the Vercel project.
      # Without it every visitor shares one rate-limit budget, because every
      # request arrives from Vercel's network and looks like the same client.
      - key: PROXY_SHARED_SECRET
        sync: false

      # Render terminates TLS and forwards to the container, so exactly one
      # proxy it controls sits in front of this process.
      - key: TRUSTED_PROXY_COUNT
        value: "1"

      - key: STORAGE_DIR
        value: /app/storage

      # One-line JSON per event, which is what Render's log search expects.
      - key: LOG_JSON
        value: "true"

      # Deliberately below the 500k default: 512 MB of RAM is the binding
      # constraint on the free plan, and a down-sampled analysis with a clear
      # notice beats an instance the platform kills mid-upload.
      - key: MAX_ANALYSIS_ROWS
        value: "150000"

      # The public demo: an unauthenticated POST /auth/demo that creates a
      # throwaway workspace seeded with the sample dataset, which is what the
      # "Use sample data" button calls. Worth having on a portfolio deployment
      # — it is how someone looks around without signing up — and it is bounded:
      # rate-limited like any auth endpoint, and each workspace is deleted with
      # its files after DEMO_SESSION_HOURS. Set to false to remove the endpoint.
      - key: DEMO_DATA_ENABLED
        value: "true"

      # --- AI -------------------------------------------------------------
      # The product is fully functional with no model at all: every number is
      # computed deterministically and the model only ever explains what was
      # already computed. Leave these as they are to deploy without AI.
      #
      # To enable it, set AI_ENABLED=true and AI_PROVIDER=openai, then fill in
      # OPENAI_API_KEY. `openai` names the protocol, not the vendor — the
      # base URL below points at Groq, whose free developer tier needs no
      # credit card and answers in seconds rather than minutes. Get a key at
      # https://console.groq.com/keys
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: none
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false
